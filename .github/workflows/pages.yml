# Baut die Web-App (web/) und veröffentlicht sie auf GitHub Pages.
# Einmalig nötig: Repo → Settings → Pages → Source: "GitHub Actions".
name: Web-App veröffentlichen

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  # neue Daten (Branch "daten") lösen ebenfalls eine Veröffentlichung aus
  repository_dispatch:
    types: [daten-aktualisiert]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Berechnungsergebnisse liegen auf dem Branch "daten" (wird bei jeder
      # Neuberechnung ersetzt, damit der Git-Verlauf nicht wächst)
      - uses: actions/checkout@v4
        with:
          ref: daten
          path: web/public/data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
