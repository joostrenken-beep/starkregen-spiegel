# Starkregen-Spiegel – Konfiguration Pilotgebiet Osterholz-Scharmbeck
# Alle Koordinaten in ETRS89 / UTM Zone 32N (EPSG:25832), Meter.

gebiet:
  name: Osterholz-Scharmbeck Innenstadt
  crs: EPSG:25832
  # Kerngebiet: hier werden Ergebnisse angezeigt (2 × 2 km)
  kern:      [485000, 5896000, 487000, 5898000]   # [xmin, ymin, xmax, ymax]
  # Rechengebiet inkl. 1 km Puffer, damit Zufluss von außen und Senken am Rand stimmen
  rechnung:  [484000, 5895000, 488000, 5899000]
  # Für Meilenstein 1 (eine Kachel): nur diese Kachel rechnen, wenn gesetzt
  test_kachel: [486000, 5897000, 487000, 5898000]

dgm:
  ordner: data/raw/dgm1          # GeoTIFF/COG-Kacheln (1 m) des LGLN; --fetch lädt sie automatisch
  zellgroesse: 1.0

gebaeude:
  quelle: alkis                  # alkis (amtlich, Standard) | osm
  einbrennhoehe: 5.0             # m über Gelände: Wasser fließt um Häuser herum
  # Innenhöfe/Nischen, die nur durch Gebäude eingeschlossen sind, laufen ab dieser
  # Höhe über die angrenzenden Gebäude ab (Tor, Durchgang, Türschwelle)
  hof_schwelle_m: 0.30
  ring_breite: 2                 # Zellen um das Gebäude für "Wasser an der Hauswand"
  # Gewässer, die an Straße/Bahn unterbrochen sind, als verrohrt annehmen und öffnen
  durchlaesse_ableiten: true

# --- Durchlässe ----------------------------------------------------------
# Wo ein Gewässer einen Damm (Straße/Bahn) quert, wird geprüft, wie tief man das DGM
# durchstechen müsste. Bis zur Schwelle: offener Graben (Durchstich).
# Darüber: Damm bleibt, Durchlass mit begrenzter Leistung (Q · Regendauer).
durchlaesse:
  aushub_schwelle_m: 0.5
  # Standard 1,0 m³/s ≈ DN 800–1000 bei Vollfüllung. Bewusst vorsichtig gewählt:
  # zu kleine Werte zeigen eher zu viel Wasser (sichere Seite).
  q_standard_m3s: 1.0
  # Bekannte Durchlässe: Lage (UTM, Dammkrone laut durchlaesse.geojson) + Leistung
  einzelwerte: []
  #  - {x: 485628, y: 5896426, radius_m: 30, q_m3s: 3.5}

# --- Abflussbildung -------------------------------------------------------
# Je Zelle: Versiegelungsgrad s (0..1). Abfluss =
#   s     · max(0, P − Benetzung_versiegelt − Kanalabschlag)
# + (1−s) · max(0, P − Anfangsverlust_unversiegelt − Infiltration · Dauer)
# Dachflächen: wie versiegelt, Überschuss tritt am Gebäuderand aufs Gelände
# (überlastete Fallrohre / Rückstau aus Grundleitungen).
abfluss:
  versiegelt:
    benetzungsverlust_mm: 1.5
  unversiegelt:
    anfangsverlust_mm: 5.0
    infiltration_mm_h: 10.0      # Sand der Geest höher, Moor/Niederung niedriger
  kanal:
    # Pauschale Kanalkapazität für an den Kanal angeschlossene versiegelte Flächen.
    # 20 mm/h ≈ grob ein 2- bis 3-jährlicher Stundenregen in der Region –
    # bitte mit KOSTRA-DWD-2020 (Rasterfeld Osterholz-Scharmbeck) prüfen.
    abschlag_mm_h: 20.0
  # Versiegelungsgrad aus ALKIS "tatsächliche Nutzung" (ohne Gebäude, die zählen
  # separat als Dach). Erster passender Präfix gewinnt. Werte = Schätzungen für den
  # nicht überbauten Teil der Fläche; bei Bedarf anpassen.
  versiegelung_alkis:
    - ["Strassenverkehr, Begleitfläche", 0.2]
    - ["Strassenverkehr", 0.9]
    - ["Platz", 0.9]
    - ["Weg, Rad- und Fußweg", 0.8]
    - ["Weg, Fußweg", 0.6]
    - ["Weg", 0.4]                       # viele Wirtschaftswege unbefestigt
    - ["Wohnbaufläche, Geschlossen", 0.6]
    - ["Wohnbaufläche", 0.3]             # Einfahrten, Terrassen, Höfe
    - ["Industrie- und Gewerbefläche, Kläranlage", 0.5]
    - ["Industrie- und Gewerbefläche", 0.75]
    - ["Fläche gemischter Nutzung", 0.4]
    - ["Flächen besonderer funktionaler Prägung, Parken", 0.9]
    - ["Flächen besonderer funktionaler Prägung", 0.5]
    - ["Bahnverkehr, Gebäude- und Freifläche", 0.5]
    - ["Bahnverkehr", 0.15]              # Schotter versickert
    - ["Flugverkehr", 0.1]
    - ["Schiffsverkehr", 0.6]
    - ["Sport-, Freizeit- und Erholungsfläche, Sportanlage", 0.2]
    - ["Sport-", 0.1]
    - ["Friedhof", 0.1]
  versiegelungsgrad:             # nur bei quelle: osm; Straßen/Parkplätze = 1
    strasse: 1.0
    parkplatz: 1.0
    landuse_residential: 0.35    # Hofflächen, Einfahrten, Terrassen
    landuse_commercial: 0.7
    landuse_retail: 0.7
    landuse_industrial: 0.7
    sonstiges: 0.0
  strassenbreite_m:              # Puffer um OSM-Straßenachsen
    primary: 8
    secondary: 7
    tertiary: 6.5
    residential: 5.5
    unclassified: 5
    living_street: 5
    service: 3.5
    pedestrian: 4
    footway: 2
    cycleway: 2
    path: 1.5
    track: 3
  manning_n:
    versiegelt: 0.015
    unversiegelt: 0.05

szenarien:                       # Blockregen
  - {id: p30, niederschlag_mm: 30, dauer_h: 1}
  - {id: p50, niederschlag_mm: 50, dauer_h: 1}
  - {id: p80, niederschlag_mm: 80, dauer_h: 1}

# Vergleichslauf mit den Annahmen der Hinweiskarte Starkregengefahren (BKG/NLWKN):
# 100 mm in 1 h, ohne Kanal und ohne Versickerung. Nur zur Methodenprüfung.
vergleich_hwk:
  aktiv: true
  szenario: {id: hwk100, niederschlag_mm: 100, dauer_h: 1, ohne_verluste: true}
  wms_layer: ni_tiefe_extrem

ampel:                           # max. Wassertiefe im Ring um das Gebäude
  gelb_ab_m: 0.10
  rot_ab_m: 0.30
  # Die Tiefe muss auf mindestens dieser Fläche im 2-m-Ring erreicht werden.
  # Kleinere, tiefe Stellen (Kellerabgang, Lichtschacht, DGM-Artefakt an der
  # Hauswand) erzeugen einen eigenen Hinweis statt Rot.
  min_flaeche_m2: 5

ausgabe:
  ordner: data/processed
  web_ordner: web/public/data

web:
  fliessweg_min_m3: 30         # Fließwege erst ab diesem durchgeflossenen Volumen zeigen
